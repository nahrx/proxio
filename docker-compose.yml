services:
  proxio:
    build: .
    image: proxio:latest
    container_name: proxio
    restart: unless-stopped
    ports:
      - "8080:8080"   # UI + rewriting proxy + /proxy.pac + diagnosa
      - "8081:8081"   # CONNECT forward proxy (SSO/Cloudflare, TLS end-to-end)
    command:
      - "-addr"
      - ":8080"
      - "-forward"
      - ":8081"
      - "-fwd-hosts"
      - "${FWD_HOSTS:-bps.go.id}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
