services:
  proxio:
    build: .
    image: proxio:latest
    container_name: proxio
    restart: unless-stopped
    ports:
      - "${PORT_REWRITE}:${PORT_REWRITE}" # UI + rewriting proxy + /proxy.pac + diagnosa
      - "${PORT_FORWARD}:${PORT_FORWARD}" # CONNECT forward proxy (SSO/Cloudflare, TLS end-to-end)
    command:
      - "-addr"
      - ":${PORT_REWRITE}"
      - "-forward"
      - ":${PORT_FORWARD}"
      - "-fwd-hosts"
      - "${FWD_HOSTS:-bps.go.id}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${PORT_REWRITE:-8080}/__version",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
